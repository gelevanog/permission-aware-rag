[project]
name = "clearance"
version = "0.1.0"
description = "Clearance: a private company RAG that answers only from documents each user is allowed to see. Permission-aware retrieval (pgvector pre-filter + PostgreSQL row-level security), OIDC groups, Drive/SharePoint permission sync, local models by default."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ivan Savchenko" }]
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "anthropic>=1.0",
    "fastapi",
    "fastembed",
    "httpx",
    "numpy",
    "pgvector",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "pyjwt[crypto]",
    "python-multipart",
    "pyyaml",
    "rich",
    "sqlalchemy>=2.0",
    "structlog",
    "typer",
    "uvicorn[standard]",
]

[dependency-groups]
dev = ["hypothesis", "mypy", "pytest", "ruff", "types-pyyaml"]

[project.scripts]
clearance = "clearance.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clearance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: needs PostgreSQL with pgvector (TEST_DATABASE_URL); skipped otherwise unless REQUIRE_TEST_DB=1",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "C4", "PIE", "RET", "TC", "S608"]
ignore = ["TC001", "TC002", "TC003", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S608"]
"src/clearance/db/migrations/**" = ["S608"]  # identifiers are validated, values are constants

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.File", "fastapi.Form", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["clearance"]

[[tool.mypy.overrides]]
module = ["fastembed.*", "pgvector.*"]
ignore_missing_imports = true
