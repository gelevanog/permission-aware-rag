name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_LINK_MODE: copy
  NEXT_TELEMETRY_DISABLED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: mypy (strict)
        run: uv run mypy

  backend-test:
    name: Backend tests (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: clearance
          POSTGRES_PASSWORD: clearance
          POSTGRES_DB: clearance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clearance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # No API keys and no model downloads: the hashing embedder and the extractive model stand in.
      TEST_DATABASE_URL: postgresql+psycopg://clearance:clearance@localhost:5432/clearance_test
      REQUIRE_TEST_DB: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest --junitxml=report.xml

      - name: CLI smoke run (hashing embedder, extractive model)
        env:
          CLEARANCE_DATABASE_URL: postgresql+psycopg://clearance:clearance@localhost:5432/clearance_test
          CLEARANCE_EMBEDDING_PROVIDER: hash
          CLEARANCE_LLM_PROVIDER: extractive
        run: |
          uv run clearance ingest data/company
          uv run clearance ask "What is the per diem in Portugal?" --as dan.kim
          uv run clearance ask "What is the salary band for a Senior Engineer (L4)?" --as bob.tanner

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-report
          path: report.xml

  frontend:
    name: Frontend lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The embedding model is downloaded on first start (BAKE_MODELS=false), so CI never downloads model weights.
      - name: Build API image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: clearance-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image (no push)
        uses: docker/build-push-action@v7
        with:
          context: web
          push: false
          tags: clearance-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
